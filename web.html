<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metro Route Finder</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 0 16px;
      color: #111;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
      font-size: 14px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
    }
    button.go {
      width: 100%;
      padding: 12px;
      background: #0067B0;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
    }
    button.go:hover {
      background: #00528c;
    }
    .route-card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 14px;
      margin-top: 12px;
      background: #f9f9f9;
    }
    .route-card.selected {
      border-color: #0067B0;
      background: #f0f7fc;
    }
    .tag {
      font-size: 11px;
      font-weight: bold;
      color: #2e7d32;
      text-transform: uppercase;
    }
    .details {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 6px;
    }
    .time {
      font-size: 22px;
      font-weight: bold;
    }
    .price {
      font-size: 18px;
      font-weight: 600;
      color: #333;
    }
    .meta {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <h2>Metro Route Finder</h2>

  <!-- Inputs -->
  <div class="form-group">
    <label for="fromInput">From Station</label>
    <input list="stationList" id="fromInput" placeholder="e.g. Roppongi" value="Roppongi">
  </div>

  <div class="form-group">
    <label for="toInput">To Station</label>
    <input list="stationList" id="toInput" placeholder="e.g. Asakusa" value="Asakusa">
  </div>

  <div class="form-group">
    <label for="fareToggle">Fare Type</label>
    <select id="fareToggle">
      <option value="adult_ic" selected>Adult (IC Card)</option>
      <option value="adult_ticket">Adult (Paper Ticket)</option>
      <option value="children_ic">Child (IC Card)</option>
      <option value="children_ticket">Child (Paper Ticket)</option>
    </select>
  </div>

  <datalist id="stationList"></datalist>

  <button class="go" id="findBtn">Find Routes</button>

  <!-- Output: Up to 3 Paths -->
  <div id="results" style="margin-top: 20px;"></div>

  <!-- Dummy/Hidden elements so existing app.js won't throw null reference errors -->
  <div id="swapBtn" style="display:none;"></div>
  <div id="detailPanel" style="display:none;"></div>
  <div id="map" style="display:none;"></div>
  <div id="legend" style="display:none;"></div>
  <div id="baseToggle" style="display:none;"></div>
  <div id="clock" style="display:none;"></div>

  <!-- Modular Scripts -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
